services:
  postgres:
    # PostgreSQL 18 + pgvector 0.8.2. Major Postgres upgrades require a fresh
    # local volume (or pg_upgrade); this dev/test stack treats data as disposable.
    image: pgvector/pgvector:0.8.2-pg18
    container_name: neuronexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuronexus
      POSTGRES_PASSWORD: neuronexus
      POSTGRES_DB: neuronexus
      # Second DB created on first boot by /docker-entrypoint-initdb.d/init.sql
      POSTGRES_MULTIPLE_DATABASES: neuronexus_test
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 stores clusters below a major-version directory.
      - neuronexus-pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuronexus -d neuronexus']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for field media (M2). Local dev only — prod
  # points the same S3_* env at Cloudflare R2 / AWS S3 with no code change.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: neuronexus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neuronexus
      MINIO_ROOT_PASSWORD: neuronexus-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - neuronexus-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the media bucket and keep it private. Card images are
  # read through the API session (`GET /media/:id/content`), not by anonymous
  # GET of `media/<uuid>`. `anonymous set none` also locks a bucket that an
  # older compose file had switched to public-read.
  createbuckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: neuronexus-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 neuronexus neuronexus-secret &&
      mc mb --ignore-existing local/neuronexus-media &&
      mc anonymous set none local/neuronexus-media &&
      echo 'bucket neuronexus-media ready (private)';
      "

volumes:
  neuronexus-pgdata:
  neuronexus-minio:
