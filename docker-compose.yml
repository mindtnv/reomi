services:
  postgres:
    # PostgreSQL 18 + pgvector 0.8.2. Major Postgres upgrades require a fresh
    # local volume (or pg_upgrade); this dev/test stack treats data as disposable.
    image: pgvector/pgvector:0.8.2-pg18
    container_name: neuronexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuronexus
      POSTGRES_PASSWORD: neuronexus
      POSTGRES_DB: neuronexus
      # Second DB created on first boot by /docker-entrypoint-initdb.d/init.sql
      POSTGRES_MULTIPLE_DATABASES: neuronexus_test
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 stores clusters below a major-version directory.
      - neuronexus-pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuronexus -d neuronexus']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for field media (M2). Local dev and CI only —
  # prod points the same S3_* env at Cloudflare R2 / AWS S3 with no code change.
  # Upstream MinIO registry images are no longer anonymously pullable. Silo is
  # the maintained compatible server (MINIO_* env, S3 API, /minio/health, mc).
  # The release tag and multi-arch manifest digest are both pinned.
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: neuronexus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neuronexus
      MINIO_ROOT_PASSWORD: neuronexus-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - neuronexus-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the media bucket and make it public-read (download).
  # Stored <img> tokens resolve to ${S3_PUBLIC_BASE_URL}/media/<uuid>.
  createbuckets:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: neuronexus-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 neuronexus neuronexus-secret &&
      mc mb --ignore-existing local/neuronexus-media &&
      mc anonymous set download local/neuronexus-media &&
      echo 'bucket neuronexus-media ready (public-read)';
      "

volumes:
  neuronexus-pgdata:
  neuronexus-minio:
