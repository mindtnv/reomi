# Push to main → ONE run: tests + both image builds in parallel, then a gated
# deploy. Coolify never builds — deploys are pulls of prebuilt GHCR images.
#
# Speed notes:
#  * build jobs use buildx + GHA layer cache (mode=max) — warm builds reuse the
#    bun-install and next-build layers; only changed layers rebuild.
#  * the test job runs in PARALLEL with the builds; deploy waits for all three,
#    so wall-clock = max(tests, slowest build) + ~40s of deploy.
#  * provenance off — skips attestation manifests Coolify doesn't use.
#  * concurrency serializes runs WITHOUT cancelling an in-flight deploy
#    (cancel-in-progress would be able to kill a half-applied deploy job);
#    superseded QUEUED runs are auto-cancelled by GitHub.
#
# Secrets: COOLIFY_TOKEN (team-8 API token). NEXT_PUBLIC_* are build args here
# (baked into the web bundle — Coolify never sees them).
# Rollback: point docker_registry_image_tag at a previous sha via the Coolify
# API/UI and redeploy.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  COOLIFY_URL: https://coolify.anvgrptools.ru/api/v1
  API_APP_UUID: u6kweu7gzzw9kidpuq7i0n7y
  WEB_APP_UUID: tmc5k98iayyj0g28qr7inbaj

jobs:
  test:
    name: Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: neuronexus
          POSTGRES_PASSWORD: neuronexus
          POSTGRES_DB: neuronexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronexus -d neuronexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus
      TEST_DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      BETTER_AUTH_SECRET: ci-secret-32chars-ci-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_PORT: '3000'
      # required() by apps/api/src/env.ts — tests never hit a real S3 (seams).
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: neuronexus-test
      S3_ACCESS_KEY_ID: ci-test
      S3_SECRET_ACCESS_KEY: ci-test
      S3_PUBLIC_BASE_URL: http://localhost:9000/neuronexus-test
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:9000/neuronexus-test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Validate OpenSpec
        run: bun run spec:validate
      - name: Apply migrations against test DB
        run: bun run db:migrate:apply:test
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test:ci

  s3-integration:
    name: S3 round trips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: neuronexus
          POSTGRES_PASSWORD: neuronexus
          POSTGRES_DB: neuronexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronexus -d neuronexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      TEST_DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      BETTER_AUTH_SECRET: ci-secret-32chars-ci-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_PORT: '3000'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: neuronexus-media
      S3_ACCESS_KEY_ID: neuronexus
      S3_SECRET_ACCESS_KEY: neuronexus-secret
      S3_PUBLIC_BASE_URL: http://localhost:9000/neuronexus-media
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:9000/neuronexus-media
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Start disposable S3
        run: |
          docker compose up -d --wait minio
          docker compose run --rm --no-deps createbuckets
      - name: Apply migrations against test DB
        run: bun run db:migrate:apply:test
      - name: Test real S3 round trips
        run: bun run test:s3:ci

  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/neuronexus-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/neuronexus-api:latest
            ghcr.io/${{ github.repository_owner }}/reomi-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/reomi-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.reomi.ru
            NEXT_PUBLIC_MEDIA_BASE_URL=https://s3.1dedic.ru/neuronexus
          tags: |
            ghcr.io/${{ github.repository_owner }}/neuronexus-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/neuronexus-web:latest
            ghcr.io/${{ github.repository_owner }}/reomi-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/reomi-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, s3-integration, build-api, build-web]
    steps:
      - name: Point Coolify at the new tags and deploy
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" -H "Content-Type: application/json")
          # Drain the old writer before the new image applies migrations.
          # In particular, provenance backfills cannot race an older API.
          curl -fsS "${auth[@]}" -X POST "$COOLIFY_URL/applications/$API_APP_UUID/stop?docker_cleanup=false" > /dev/null
          stopped=""
          for i in $(seq 1 30); do
            stopped=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/applications/$API_APP_UUID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            case "$stopped" in exited*|stopped*) break ;; esac
            sleep 2
          done
          case "$stopped" in exited*|stopped*) ;; *) echo "::error::old API did not stop: $stopped"; exit 1 ;; esac
          for uuid in "$API_APP_UUID" "$WEB_APP_UUID"; do
            curl -fsS "${auth[@]}" -X PATCH "$COOLIFY_URL/applications/$uuid" \
              -d "{\"docker_registry_image_tag\":\"$GITHUB_SHA\"}" > /dev/null
            dep=$(curl -fsS "${auth[@]}" -X POST "$COOLIFY_URL/deploy?uuid=$uuid" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])')
            echo "queued $uuid → deployment $dep"
            # Complete the API rollout (including migrations) before starting web.
            deployment_status=""
            for i in $(seq 1 60); do
              deployment_status=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/deployments/$dep" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
              case "$deployment_status" in
                finished) break ;;
                failed|cancelled) echo "::error::deployment $dep is $deployment_status"; exit 1 ;;
              esac
              sleep 5
            done
            [ "$deployment_status" = "finished" ] || { echo "::error::deployment $dep timed out"; exit 1; }
            status=""
            for i in $(seq 1 24); do
              status=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/applications/$uuid" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
              case "$status" in running:healthy*) break ;; esac
              sleep 5
            done
            case "$status" in running:healthy*) ;; *) echo "::error::app $uuid is $status"; exit 1 ;; esac
          done
      - name: Wait for deployments to finish
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          for i in $(seq 1 30); do
            sleep 10
            left=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/deployments" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); items=d if isinstance(d,list) else d.get("deployments",[]); print(sum(1 for x in items if (name:=str(x.get("application_name","")).lower()) and ("neuronexus" in name or "reomi" in name)))')
            echo "[$i] in-flight: $left"
            [ "$left" = "0" ] && break
          done
          # The pull finishes well before the container clears its healthcheck
          # start period — poll the app status, treating transitional states
          # (starting/unhealthy right after boot) as in-progress.
          for uuid in "$API_APP_UUID" "$WEB_APP_UUID"; do
            status=""
            for i in $(seq 1 24); do
              status=$(curl -fsS "${auth[@]}" "$COOLIFY_URL/applications/$uuid" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
              echo "[$i] $uuid → $status"
              case "$status" in running:healthy*) break;; esac
              sleep 10
            done
            case "$status" in running:healthy*) ;; *) echo "::error::app $uuid is $status"; exit 1;; esac
          done
