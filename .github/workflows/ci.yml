# PR gate: typecheck + tests + next build. Pushes to main are covered by
# deploy.yml (same test gate + image builds) — running CI there too would
# double every signal.

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres 18 as a sidecar. Tests point at TEST_DATABASE_URL which
    # `packages/db/src/env.ts` picks up when NODE_ENV=test.
    services:
      postgres:
        # pgvector image so the `db:migrate:apply:test` step (CREATE EXTENSION
        # vector in the 0010_* migration) succeeds against the test DB.
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: neuronexus
          POSTGRES_PASSWORD: neuronexus
          POSTGRES_DB: neuronexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronexus -d neuronexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus
      TEST_DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      BETTER_AUTH_SECRET: ci-secret-32chars-ci-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_PORT: '3000'
      # S3 vars are required() by apps/api/src/env.ts since the media
      # milestone — tests never hit a real S3 (seams), dummies suffice.
      # Locally `bun test` auto-loads ./.env, which is why their absence
      # only ever bites in CI.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: neuronexus-test
      S3_ACCESS_KEY_ID: ci-test
      S3_SECRET_ACCESS_KEY: ci-test
      S3_PUBLIC_BASE_URL: http://localhost:9000/neuronexus-test
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:9000/neuronexus-test

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Validate OpenSpec
        run: bun run spec:validate

      - name: Apply migrations against test DB
        run: bun run db:migrate:apply:test

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:ci

      # Production build — catches server-component / SSR regressions before
      # merge (on main the docker image build plays this role).
      - name: Build
        run: bun run build

  s3-integration:
    name: S3 round trips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: neuronexus
          POSTGRES_PASSWORD: neuronexus
          POSTGRES_DB: neuronexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronexus -d neuronexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      TEST_DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      BETTER_AUTH_SECRET: ci-secret-32chars-ci-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_PORT: '3000'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: neuronexus-media
      S3_ACCESS_KEY_ID: neuronexus
      S3_SECRET_ACCESS_KEY: neuronexus-secret
      S3_PUBLIC_BASE_URL: http://localhost:9000/neuronexus-media
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:9000/neuronexus-media

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Start disposable S3
        run: |
          docker compose up -d --wait minio
          docker compose run --rm --no-deps createbuckets

      - name: Apply migrations against test DB
        run: bun run db:migrate:apply:test

      - name: Test real S3 round trips
        run: bun run test:s3:ci

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Browser smoke
        run: bun run e2e

      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          path: e2e/artifacts/*.png
